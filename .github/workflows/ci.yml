name: Azure Data Engineering CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyspark

      - name: Validate PySpark files
        run: |
          python -m py_compile pyspark/bronze_to_silver.py
          python -m py_compile pyspark/silver_to_gold.py
          python -m py_compile pyspark/data_quality_checks.py
